services:
  postgres-test:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB:       weasley_deepmind_test
      POSTGRES_USER:     weasley_deepmind
      POSTGRES_PASSWORD: weasley_deepmind_test
    ports:
      - "35433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weasley_deepmind -d weasley_deepmind_test"]
      interval: 2s
      timeout: 5s
      retries: 10
